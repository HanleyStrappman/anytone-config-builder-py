[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anytone-config-builder"
dynamic = ["version"]
description = "Builds Anytone CPS import files from readable CSV inputs"
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [{ name = "Scott Robinson (AG7T)", email = "sgr@nwlink.com" }]
keywords = ["anytone", "dmr", "codeplug", "amateur-radio", "ham-radio", "cps"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
]

# Stdlib only, on purpose -- see README.
dependencies = []

[project.scripts]
anytone-config-builder = "anytone_config_builder.builder:cli"
acb = "anytone_config_builder.builder:cli"

[tool.hatch.version]
path = "anytone_config_builder/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["anytone_config_builder"]

# The sdist carries the package and its docs, not the test suite: tests/golden
# is 4MB of recorded output, and the regression tests read the working PNW CSVs
# from the repo root, so they only mean anything in a checkout.
[tool.hatch.build.targets.sdist]
include = [
    "/anytone_config_builder",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE.md",
]

# The version lives in one place -- anytone_config_builder/__init__.py, which
# hatchling reads above. bump-my-version rewrites it, commits and tags:
#
#     uvx bump-my-version bump patch     # or minor, or major
#     uvx bump-my-version show-bump      # what each of those would produce
#
# It is a release-time tool, not a dependency: nothing the package installs
# needs it, so it is deliberately not in [project].
[tool.bumpversion]
current_version = "1.0.1"
allow_dirty = false
commit = true
message = "Bump version: {current_version} -> {new_version}"
tag = true
tag_name = "v{new_version}"
tag_message = "Version {new_version}"
sign_tags = false

[[tool.bumpversion.files]]
filename = "anytone_config_builder/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
